version: '3.9'
services:
  # PostgreSQL Primary
  postgres:
    image: postgres:16-alpine
    container_name: aasop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aasop
      POSTGRES_PASSWORD: aasop
      POSTGRES_DB: aasop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aasop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aasop

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aasop-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aasop

  # Redis
  redis:
    image: redis:7-alpine
    container_name: aasop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aasop

  # NATS JetStream
  nats:
    image: nats:2.10-alpine
    container_name: aasop-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--js --store_dir /data --http_port 8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aasop

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22
    container_name: aasop-temporal
    restart: unless-stopped
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: aasop
      POSTGRES_PWD: aasop
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    volumes:
      - ./infra/docker/temporal/development.yaml:/etc/temporal/config/dynamicconfig/development.yaml
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - aasop

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:2.21
    container_name: aasop-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8088:8080"
    depends_on:
      - temporal
    networks:
      - aasop

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.50
    container_name: aasop-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - aasop

  # Grafana
  grafana:
    image: grafana/grafana:10.4
    container_name: aasop-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - aasop

  # Loki
  loki:
    image: grafana/loki:2.9
    container_name: aasop-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/docker/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - aasop

  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: aasop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: aasop
      MINIO_ROOT_PASSWORD: aasop12345
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aasop

  # API Gateway
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aasop-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://aasop:aasop@postgres:5432/aasop
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NATS_URL: nats://nats:4222
      TEMPORAL_HOST: temporal:7233
      LOKI_HOST: http://loki:3100
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: aasop
      MINIO_SECRET_KEY: aasop12345
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aasop

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aasop-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    depends_on:
      - api
    networks:
      - aasop

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  minio_data:
    driver: local

networks:
  aasop:
    driver: bridge
    name: aasop
