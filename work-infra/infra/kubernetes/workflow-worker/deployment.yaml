apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  namespace: aasop
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aasop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: aasop
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4200"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: workflow-worker
      securityContext:
        fsGroup: 1001
      containers:
        - name: workflow-worker
          image: aasop/workflow-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          env:
            - name: SERVICE_NAME
              value: workflow-worker
            - name: TEMPORAL_TASK_QUEUE
              value: aasop-tasks
            - name: TEMPORAL_MAX_CONCURRENT_ACTIVITY_EXECUTIONS
              value: "100"
            - name: TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASK_EXECUTIONS
              value: "50"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  node -e "
                    const http = require('http');
                    const req = http.request({host:'localhost',port:4200,path:'/health',method:'GET',timeout:3000}, (res) => {
                      process.exit(res.statusCode === 200 ? 0 : 1);
                    });
                    req.on('error', () => process.exit(1));
                    req.on('timeout', () => { req.destroy(); process.exit(1); });
                    req.end();
                  "
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      terminationGracePeriodSeconds: 60
