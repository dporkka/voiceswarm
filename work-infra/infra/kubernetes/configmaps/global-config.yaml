apiVersion: v1
kind: ConfigMap
metadata:
  name: global-config
  namespace: aasop
  labels:
    app.kubernetes.io/name: global-config
    app.kubernetes.io/part-of: aasop
data:
  ENVIRONMENT: "production"
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "aasop"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=aasop"
