apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: aasop
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
    app.kubernetes.io/part-of: aasop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - port: 7233
      targetPort: 7233
      protocol: TCP
      name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: aasop
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/component: workflow-engine
    app.kubernetes.io/part-of: aasop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
