apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aasop
  labels:
    app.kubernetes.io/name: default-deny
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: aasop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: aasop
  labels:
    app.kubernetes.io/name: allow-dns
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: aasop
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
