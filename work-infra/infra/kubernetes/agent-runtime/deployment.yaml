apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: aasop
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: aasop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: aasop
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-runtime
      securityContext:
        fsGroup: 1001
      containers:
        - name: agent-runtime
          image: aasop/agent-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4100
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          env:
            - name: SERVICE_NAME
              value: agent-runtime
            - name: MAX_CONCURRENT_AGENTS
              value: "50"
            - name: AGENT_TIMEOUT_MS
              value: "300000"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      terminationGracePeriodSeconds: 60
