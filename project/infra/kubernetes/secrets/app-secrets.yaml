apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: aasop
  labels:
    app.kubernetes.io/name: app-secrets
    app.kubernetes.io/part-of: aasop
type: Opaque
stringData:
  # AI Provider Keys
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_AI_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""

  # Authentication
  CLERK_SECRET_KEY: ""
  CLERK_PUBLISHABLE_KEY: ""

  # Encryption
  MASTER_KEY: "ChangeMeInProduction-MasterKey-Min32Chars"
  JWT_SECRET: "ChangeMeInProduction-JWT-Secret-Min32Chars"

  # Object Storage
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  S3_BUCKET_NAME: "aasop-storage"
  S3_REGION: "us-east-1"
