apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: aasop
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-database
    app.kubernetes.io/part-of: aasop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      protocol: TCP
      name: http
    - port: 6334
      targetPort: 6334
      protocol: TCP
      name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: aasop
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-database
    app.kubernetes.io/part-of: aasop
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      protocol: TCP
      name: http
    - port: 6334
      targetPort: 6334
      protocol: TCP
      name: grpc
