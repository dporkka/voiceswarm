apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: aasop
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: aasop
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222
    server_name: $POD_NAME
    jetstream {
      store_dir: "/data"
      max_memory_store: 256MB
      max_file_store: 1GB
    }
    cluster {
      name: aasop-nats
      listen: 0.0.0.0:6222
      routes: [
        nats://nats-0.nats-headless:6222,
        nats://nats-1.nats-headless:6222,
        nats://nats-2.nats-headless:6222
      ]
    }
