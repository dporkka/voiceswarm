apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: aasop
  labels:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/component: websocket
    app.kubernetes.io/part-of: aasop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime
        app.kubernetes.io/component: websocket
        app.kubernetes.io/part-of: aasop
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4300"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: realtime
      securityContext:
        fsGroup: 1001
      containers:
        - name: realtime
          image: aasop/realtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4300
              name: websocket
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          env:
            - name: SERVICE_NAME
              value: realtime
            - name: REDIS_ADAPTER_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: REDIS_URL
            - name: MAX_CONNECTIONS_PER_NODE
              value: "10000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4300
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 4300
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 4300
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      terminationGracePeriodSeconds: 30
