global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: aasop-api
    static_configs:
      - targets:
          - api:4000
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: aasop-web
    static_configs:
      - targets:
          - web:3000
    metrics_path: /api/metrics
    scrape_interval: 15s

  - job_name: aasop-agent-runtime
    static_configs:
      - targets:
          - agent-runtime:4100
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: aasop-workflow-worker
    static_configs:
      - targets:
          - workflow-worker:4200
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: aasop-realtime
    static_configs:
      - targets:
          - realtime:4300
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: aasop-voice-service
    static_configs:
      - targets:
          - voice-service:4400
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
    scrape_interval: 15s

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
    scrape_interval: 15s

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
    scrape_interval: 15s

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    scrape_interval: 15s
