name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ============================================================
  # Build & Push Docker Images
  # ============================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker meta
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all images
        run: |
          for app in api web agent-runtime workflow-worker realtime; do
            echo "Building $app..."
            docker buildx build \
              --platform linux/amd64 \
              --file apps/$app/Dockerfile \
              --tag $ECR_REGISTRY/aasop/$app:${{ steps.meta.outputs.tag }} \
              --tag $ECR_REGISTRY/aasop/$app:latest \
              --cache-from type=gha,scope=$app \
              --cache-to type=gha,mode=max,scope=$app \
              --push \
              .
          done

  # ============================================================
  # Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.aasop.example.com
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name aasop-staging-eks

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i "s|image: aasop/api:.*|image: $ECR_REGISTRY/aasop/api:$IMAGE_TAG|" infra/kubernetes/api/deployment.yaml
          sed -i "s|image: aasop/web:.*|image: $ECR_REGISTRY/aasop/web:$IMAGE_TAG|" infra/kubernetes/web/deployment.yaml
          sed -i "s|image: aasop/agent-runtime:.*|image: $ECR_REGISTRY/aasop/agent-runtime:$IMAGE_TAG|" infra/kubernetes/agent-runtime/deployment.yaml
          sed -i "s|image: aasop/workflow-worker:.*|image: $ECR_REGISTRY/aasop/workflow-worker:$IMAGE_TAG|" infra/kubernetes/workflow-worker/deployment.yaml
          sed -i "s|image: aasop/realtime:.*|image: $ECR_REGISTRY/aasop/realtime:$IMAGE_TAG|" infra/kubernetes/realtime/deployment.yaml

      - name: Deploy to staging
        run: |
          kubectl apply -k infra/kubernetes/overlays/staging/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n aasop --timeout=300s
          kubectl rollout status deployment/web -n aasop --timeout=300s
          kubectl rollout status deployment/agent-runtime -n aasop --timeout=300s

      - name: Run smoke tests
        run: |
          ./scripts/smoke-tests.sh https://staging.aasop.example.com

  # ============================================================
  # Deploy to Production (manual approval required)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://aasop.example.com
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name aasop-prod-eks

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i "s|image: aasop/api:.*|image: $ECR_REGISTRY/aasop/api:$IMAGE_TAG|" infra/kubernetes/api/deployment.yaml
          sed -i "s|image: aasop/web:.*|image: $ECR_REGISTRY/aasop/web:$IMAGE_TAG|" infra/kubernetes/web/deployment.yaml
          sed -i "s|image: aasop/agent-runtime:.*|image: $ECR_REGISTRY/aasop/agent-runtime:$IMAGE_TAG|" infra/kubernetes/agent-runtime/deployment.yaml
          sed -i "s|image: aasop/workflow-worker:.*|image: $ECR_REGISTRY/aasop/workflow-worker:$IMAGE_TAG|" infra/kubernetes/workflow-worker/deployment.yaml
          sed -i "s|image: aasop/realtime:.*|image: $ECR_REGISTRY/aasop/realtime:$IMAGE_TAG|" infra/kubernetes/realtime/deployment.yaml

      - name: Deploy to production (canary)
        run: |
          # Deploy canary first (1 replica)
          kubectl apply -k infra/kubernetes/overlays/prod-canary/
          kubectl rollout status deployment/api-canary -n aasop --timeout=300s

      - name: Run smoke tests on canary
        run: |
          ./scripts/smoke-tests.sh https://aasop.example.com

      - name: Promote to full production
        run: |
          kubectl apply -k infra/kubernetes/overlays/prod/
          kubectl rollout status deployment/api -n aasop --timeout=300s
          kubectl rollout status deployment/web -n aasop --timeout=300s
          kubectl rollout status deployment/agent-runtime -n aasop --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n aasop
          kubectl get svc -n aasop

  # ============================================================
  # Notify
  # ============================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
